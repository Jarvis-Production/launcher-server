<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARTIX — Admin</title>
<style>
:root{
  --bg:#0a0b12; --bg2:#0e0f18; --panel:#14161f; --panel2:#171a26;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --txt:#e9ebf4; --muted:#9aa0bc; --dim:#666c8c;
  --peri:#8b93ff; --peri2:#9a86f5; --grad:linear-gradient(135deg,#8b93ff,#9a86f5);
  --ok:#4fd18b; --warn:#ffb347; --err:#ff6b6b;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Segoe UI",system-ui,Arial,sans-serif;
  background:radial-gradient(1200px 700px at 80% -10%,rgba(120,110,255,.10),transparent 60%),
             linear-gradient(180deg,var(--bg2),var(--bg));
  color:var(--txt); min-height:100vh; -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(139,147,255,.35)}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
input,select{font-family:inherit}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}

/* ---------- login ---------- */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-card{
  width:380px;max-width:100%;background:rgba(20,22,31,.9);border:1px solid var(--line);
  border-radius:22px;padding:38px 34px;animation:pop .4s ease both;
  box-shadow:0 30px 80px rgba(0,0,0,.55);
}
.logo{width:60px;height:60px;border-radius:17px;background:var(--grad);display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:30px;color:#fff;margin:0 auto 18px;
  box-shadow:0 10px 34px rgba(124,124,255,.5)}
.login-card h1{text-align:center;font-size:22px;letter-spacing:.5px}
.login-card p{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 26px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
input,select{width:100%;padding:13px 15px;background:#0c0e16;border:1px solid var(--line2);
  border-radius:12px;color:var(--txt);font-size:14px;outline:none;transition:.18s}
input:focus,select:focus{border-color:var(--peri);box-shadow:0 0 0 3px rgba(139,147,255,.15)}
.btn{background:var(--grad);color:#fff;font-weight:600;padding:13px;border-radius:12px;width:100%;
  font-size:15px;transition:.18s;box-shadow:0 8px 26px rgba(124,124,255,.28)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(124,124,255,.45)}
.btn:active{transform:translateY(0)}
.err{color:var(--err);font-size:13px;text-align:center;margin-top:12px;min-height:16px}

/* ---------- app ---------- */
#app{max-width:1240px;margin:0 auto;padding:22px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;animation:fadeUp .4s both}
.brand{display:flex;align-items:center;gap:12px}
.brand .b{width:40px;height:40px;border-radius:12px;background:var(--grad);display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:20px;color:#fff}
.brand h1{font-size:17px;letter-spacing:.5px}
.brand span{color:var(--dim);font-size:12px;display:block}
.top-actions{display:flex;gap:10px}
.ghost{background:var(--panel);border:1px solid var(--line);padding:9px 16px;border-radius:11px;
  font-size:13px;color:var(--muted);transition:.18s}
.ghost:hover{background:var(--panel2);color:var(--txt);border-color:var(--line2)}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
.stat{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:var(--r);padding:18px 18px;animation:fadeUp .45s both}
.stat:nth-child(2){animation-delay:.05s}.stat:nth-child(3){animation-delay:.1s}
.stat:nth-child(4){animation-delay:.15s}.stat:nth-child(5){animation-delay:.2s}
.stat .n{font-size:28px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{color:var(--muted);font-size:12.5px;margin-top:3px}
.stat.online .n{background:linear-gradient(135deg,#4fd18b,#39b6c9);-webkit-background-clip:text;background-clip:text;color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px;animation:glow 1.6s infinite}

.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tab{background:none;padding:11px 18px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;transition:.18s;margin-bottom:-1px}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--txt);border-bottom-color:var(--peri)}

.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;max-width:360px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:20px;font-size:12.5px;transition:.16s}
.chip:hover{color:var(--txt);border-color:var(--line2)}
.chip.active{background:rgba(139,147,255,.15);border-color:var(--peri);color:#cfd4ff}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;animation:fadeUp .4s both}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:13px 16px;color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}
td{padding:13px 16px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
tbody tr{transition:.14s}
tbody tr:hover{background:rgba(255,255,255,.02)}
.uname{font-weight:600}
.key{font-family:"Consolas",monospace;font-size:12px;color:var(--muted);cursor:pointer;transition:.15s}
.key:hover{color:var(--peri)}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-ok{background:rgba(79,209,139,.15);color:#7fe3ac}
.b-no{background:rgba(120,127,160,.15);color:#a2a8c4}
.b-err{background:rgba(255,107,107,.15);color:#ff9d9d}
.b-warn{background:rgba(255,179,71,.16);color:#ffca7a}
.b-adm{background:rgba(139,147,255,.18);color:#c3c8ff}
.muted{color:var(--dim);font-size:12px}

.act{position:relative;text-align:right}
.act-btn{background:var(--panel2);border:1px solid var(--line);width:32px;height:32px;border-radius:9px;color:var(--muted);font-size:16px;transition:.15s}
.act-btn:hover{background:rgba(139,147,255,.15);color:var(--peri)}
.menu{position:fixed;right:auto;top:auto;background:#191c28;border:1px solid var(--line2);border-radius:12px;
  padding:6px;min-width:180px;z-index:9999;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:pop .16s both}
.menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;padding:9px 11px;
  border-radius:8px;font-size:13px;color:var(--txt);transition:.13s}
.menu button:hover{background:rgba(255,255,255,.06)}
.menu button.danger{color:#ff8f8f}
.menu button.danger:hover{background:rgba(255,107,107,.12)}
.menu .sep{height:1px;background:var(--line);margin:5px 4px}

.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.player{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;animation:fadeUp .35s both}
.player .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.player .pn{font-weight:700;font-size:15px}
.player .row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--muted)}
.player .row b{color:var(--txt);font-weight:600}
.server-tag{background:rgba(139,147,255,.14);color:#c3c8ff;padding:4px 10px;border-radius:8px;font-size:12px;
  font-family:monospace;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.empty{text-align:center;padding:60px 20px;color:var(--dim)}
.spinner{width:26px;height:26px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--peri);border-radius:50%;
  animation:spin .8s linear infinite;margin:50px auto}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(6,7,12,.7);backdrop-filter:blur(4px);display:flex;
  align-items:center;justify-content:center;z-index:100;padding:20px;animation:pop .2s both}
.modal{background:var(--panel2);border:1px solid var(--line2);border-radius:20px;width:460px;max-width:100%;
  padding:26px;max-height:88vh;overflow:auto;animation:pop .22s both}
.modal h3{font-size:18px;margin-bottom:4px}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.dur-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.dur{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px;text-align:center;transition:.15s}
.dur:hover{border-color:var(--peri);background:rgba(139,147,255,.1)}
.dur b{display:block;font-size:16px}
.dur span{font-size:12px;color:var(--muted)}
.type-toggle{display:flex;gap:8px;margin-bottom:18px}
.type-toggle button{flex:1;padding:10px;background:var(--panel);border:1px solid var(--line2);border-radius:11px;color:var(--muted);font-size:13px}
.type-toggle button.on{background:rgba(139,147,255,.15);border-color:var(--peri);color:#cfd4ff}
.modal-close{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--muted);width:100%;margin-top:6px}
.hist{margin-top:8px}
.hist-item{display:flex;justify-content:space-between;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.hist-item:last-child{border:none}

/* toast */
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:200}
.toast{background:#191c28;border:1px solid var(--line2);border-left:3px solid var(--peri);border-radius:12px;
  padding:13px 18px;font-size:13.5px;min-width:220px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:slideIn .25s both}
.toast.ok{border-left-color:var(--ok)} .toast.err{border-left-color:var(--err)}

@media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}.hide-sm{display:none}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <form class="login-card" onsubmit="doLogin(event)">
    <div class="logo">J</div>
    <h1>JARTIX Admin</h1>
    <p>Панель управления</p>
    <div class="field"><label>Логин</label><input id="u" autocomplete="username" value="admin"></div>
    <div class="field"><label>Пароль</label><input id="p" type="password" autocomplete="current-password"></div>
    <button class="btn" type="submit">Войти</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="brand"><div class="b">J</div><div><h1>JARTIX Admin</h1><span>панель управления</span></div></div>
    <div class="top-actions">
      <button class="ghost" onclick="refreshAll()">↻ Обновить</button>
      <button class="ghost" onclick="logout()">Выйти</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="tabs">
    <button class="tab active" data-tab="users" onclick="switchTab('users')">Пользователи</button>
    <button class="tab" data-tab="players" onclick="switchTab('players')">Игроки <span id="onlineBadge"></span></button>
    <button class="tab" data-tab="logs" onclick="switchTab('logs')">Логи</button>
  </div>

  <!-- USERS -->
  <div id="tab-users">
    <div class="toolbar">
      <input class="search" id="search" placeholder="Поиск по нику или ключу…" oninput="debouncedUsers()">
      <div class="chips" id="filters">
        <button class="chip active" data-f="all" onclick="setFilter('all')">Все</button>
        <button class="chip" data-f="licensed" onclick="setFilter('licensed')">С лицензией</button>
        <button class="chip" data-f="inactive" onclick="setFilter('inactive')">Без лицензии</button>
        <button class="chip" data-f="banned" onclick="setFilter('banned')">Забанены</button>
        <button class="chip" data-f="expiring" onclick="setFilter('expiring')">Истекают</button>
      </div>
    </div>
    <div class="card"><div id="usersBody"><div class="spinner"></div></div></div>
  </div>

  <!-- PLAYERS -->
  <div id="tab-players" class="hidden">
    <div class="toolbar"><div class="muted" id="playersMeta">Игроки, отправлявшие данные за последние 15 минут</div></div>
    <div id="playersBody"><div class="spinner"></div></div>
  </div>

  <!-- LOGS -->
  <div id="tab-logs" class="hidden">
    <div class="card"><div id="logsBody"><div class="spinner"></div></div></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toasts"></div>

<script>
const API='/admin/api';
let TOKEN=localStorage.getItem('jx_admin')||'';
let curFilter='all', usersCache=[], playersTimer=null;

/* ---------- helpers ---------- */
// Resilient fetch: Render free tier cold-starts (~30-60s) and the network to
// the Cloudflare-fronted host can drop, so we retry network errors / 5xx with
// backoff instead of failing on the first "Failed to fetch".
async function api(path,opts={},_try=0){
  const MAX=4;
  let r;
  try{
    const ctrl=new AbortController();
    const to=setTimeout(()=>ctrl.abort(),45000);
    r=await fetch(API+path,{...opts,signal:ctrl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN,...(opts.headers||{})}});
    clearTimeout(to);
  }catch(e){
    if(_try<MAX){ if(_try===0)toast('Сервер просыпается…'); await sleep(1200*(_try+1)); return api(path,opts,_try+1); }
    throw new Error('Сервер недоступен — просыпается или проблемы с сетью. Повтори через пару секунд.');
  }
  if(r.status===401){logout();throw new Error('Сессия истекла');}
  if((r.status===502||r.status===503||r.status===504)&&_try<MAX){
    if(_try===0)toast('Сервер просыпается…'); await sleep(1500*(_try+1)); return api(path,opts,_try+1);
  }
  const t=await r.text(); let d={}; try{d=t?JSON.parse(t):{}}catch{d={raw:t}}
  if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
  return d;
}
function sleep(ms){return new Promise(s=>setTimeout(s,ms));}
function toast(msg,type=''){const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;
  document.getElementById('toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300)},2600);}
function esc(s){return (s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDate(d){if(!d)return '—';const x=new Date(d);return x.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function ago(d){if(!d)return '—';const s=(Date.now()-new Date(d))/1000;if(s<60)return 'только что';if(s<3600)return Math.floor(s/60)+' мин назад';if(s<86400)return Math.floor(s/3600)+' ч назад';return Math.floor(s/86400)+' дн назад';}

/* ---------- auth ---------- */
async function doLogin(e){e.preventDefault();const err=document.getElementById('loginErr');err.textContent='';
  try{const d=await(await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:u.value,password:p.value})})).json();
    if(!d.token)throw new Error(d.error||'Ошибка входа');
    TOKEN=d.token;localStorage.setItem('jx_admin',TOKEN);showApp();
  }catch(ex){err.textContent=ex.message}}
function logout(){TOKEN='';localStorage.removeItem('jx_admin');clearInterval(playersTimer);
  document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');}
function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');refreshAll();}

/* ---------- tabs ---------- */
function switchTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  ['users','players','logs'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('hidden',x!==t));
  clearInterval(playersTimer);
  if(t==='players'){loadPlayers();playersTimer=setInterval(loadPlayers,2000);}
  if(t==='logs')loadLogs();
}
function refreshAll(){loadStats();loadUsers();}

/* ---------- stats ---------- */
async function loadStats(){
  try{const s=await api('/stats');
    const box=document.getElementById('stats');
    const tile=(n,l,cls='')=>`<div class="stat ${cls}"><div class="n">${n??0}</div><div class="l">${l}</div></div>`;
    box.innerHTML=tile(s.total_users,'Пользователей')+tile(s.licensed,'С лицензией')+
      tile('<span class="dot"></span>'+(s.online||0),'Онлайн','online')+tile(s.banned,'Забанено')+tile(s.expiring_soon,'Истекает скоро');
    document.getElementById('onlineBadge').innerHTML=s.online>0?`<span class="badge b-ok">${s.online}</span>`:'';
  }catch(e){}
}

/* ---------- users ---------- */
let debTimer=null; function debouncedUsers(){clearTimeout(debTimer);debTimer=setTimeout(loadUsers,300);}
function setFilter(f){curFilter=f;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.f===f));loadUsers();}
async function loadUsers(){
  const body=document.getElementById('usersBody');
  try{
    const q=new URLSearchParams({search:document.getElementById('search').value,filter:curFilter});
    const list=await api('/users?'+q); usersCache=list;
    if(!list.length){body.innerHTML='<div class="empty">Ничего не найдено</div>';return;}
    body.innerHTML=`<table><thead><tr>
      <th>Ник</th><th>Ключ</th><th>Тип</th><th>Статус</th><th class="hide-sm">Истекает</th>
      <th class="hide-sm">HWID</th><th class="hide-sm">Вход</th><th></th></tr></thead><tbody>${list.map(rowHtml).join('')}</tbody></table>`;
  }catch(e){body.innerHTML='<div class="empty">'+esc(e.message)+'</div>';}
}
function statusBadges(u){
  let b=[];
  if(u.banned)b.push('<span class="badge b-err">Бан</span>');
  if(!u.active)b.push('<span class="badge b-err">Аннулирован</span>');
  else if(!u.license_active)b.push('<span class="badge b-no">Нет лицензии</span>');
  else b.push('<span class="badge b-ok">Активна</span>');
  if(u.license_active&&u.expires_at&&new Date(u.expires_at)<new Date(Date.now()+3*864e5)&&new Date(u.expires_at)>new Date())
    b.push('<span class="badge b-warn">Истекает</span>');
  return b.join(' ');
}
function rowHtml(u){
  const exp=u.expires_at?fmtDate(u.expires_at):(u.license_active?'∞ навсегда':'—');
  const type=u.key_type==='admin'?'<span class="badge b-adm">admin</span>':'<span class="badge b-no">client</span>';
  return `<tr id="u-${u.id}">
    <td class="uname">${esc(u.username)}</td>
    <td class="key" title="Скопировать" onclick="copyKey('${u.license_key}')">${esc(u.license_key||'—')}</td>
    <td>${type}</td>
    <td>${statusBadges(u)}</td>
    <td class="hide-sm muted">${exp}</td>
    <td class="hide-sm">${u.hwid?'<span class="badge b-ok">привязан</span>':'<span class="muted">—</span>'}</td>
    <td class="hide-sm muted">${ago(u.last_login)}</td>
    <td class="act"><button class="act-btn" onclick="toggleMenu(event,'${u.id}')">⋯</button></td>
  </tr>`;
}
function copyKey(k){if(!k)return;navigator.clipboard.writeText(k);toast('Ключ скопирован','ok');}

function toggleMenu(e,id){e.stopPropagation();closeMenus();
  const u=usersCache.find(x=>x.id===id);if(!u)return;
  const m=document.createElement('div');m.className='menu';
  m.innerHTML=`
    <button onclick="grantModal('${id}')">🎫 Выдать лицензию</button>
    <button onclick="act('${id}','revoke','Лицензия отозвана')">⏸ Отозвать лицензию</button>
    ${u.active?`<button onclick="act('${id}','annul','Ключ аннулирован')">🚫 Аннулировать ключ</button>`
             :`<button onclick="act('${id}','restore','Ключ восстановлен')">✅ Восстановить ключ</button>`}
    <div class="sep"></div>
    ${u.banned?`<button onclick="act('${id}','unban','Разбанен')">🔓 Разбанить</button>`
             :`<button onclick="act('${id}','ban','Забанен')">🔨 Забанить</button>`}
    <button onclick="act('${id}','reset-hwid','HWID сброшен')">💻 Сбросить HWID</button>
    <button onclick="rotateKey('${id}')">🔑 Новый ключ</button>
    <button onclick="detailModal('${id}')">📊 Подробнее</button>
    <div class="sep"></div>
    <button class="danger" onclick="delUser('${id}','${esc(u.username)}')">🗑 Удалить</button>`;
  const rect = e.target.getBoundingClientRect();
  m.style.left = (rect.right - 180) + 'px';
  m.style.top = (rect.bottom + 4) + 'px';
  document.body.appendChild(m);
}
function closeMenus(){document.querySelectorAll('.menu').forEach(m=>m.remove());}
document.addEventListener('click',closeMenus);

async function act(id,path,msg){closeMenus();

async function rotateKey(id){closeMenus();

async function grant(id,days){

  if(modal){modal.style.pointerEvents='none';modal.style.opacity='.55';}
  try{await api('/users/'+id+'/license',{method:'POST',body:JSON.stringify({days,key_type:grantType})});
    toast(days?('Лицензия на '+days+' дн выдана'):'Лицензия навсегда выдана','ok');closeModal();loadUsers();loadStats();}
  catch(e){toast(e.message,'err'); if(modal){modal.style.pointerEvents='';modal.style.opacity='';}}}

/* ---------- inventory items map ---------- */
const MC_ITEMS={};
const ITEM_COLORS={
  'diamond':'#4af','gold':'#fc0','iron':'#bbb','netherite':'#555','emerald':'#2d2',
  'sword':'#f55','axe':'#a74','pickaxe':'#999','shovel':'#876','bow':'#a63',
  'crossbow':'#a63','trident':'#4cf','shield':'#88c','armor':'#ddd','helmet':'#ddd',
  'chestplate':'#ddd','leggings':'#ddd','boots':'#ddd','elytra':'#c8f',
  'ender_pearl':'#3d3','ender_eye':'#3d3','shulker':'#a3f','chest':'#a84',
  'obsidian':'#333','tnt':'#f33','totem':'#fd3','potion':'#f3f',
  'enchanted':'#5f5','book':'#a84','enchant':'#5f5',
  'coal':'#333','redstone':'#f00','lapis':'#33f','diamond_block':'#4af',
};
function getItemColor(id){
  if(!id)return'#888';
  const l=id.toLowerCase();
  for(const[k,c]of Object.entries(ITEM_COLORS))if(l.includes(k))return c;
  if(l.includes('diamond'))return'#4af';if(l.includes('netherite'))return'#555';
  if(l.includes('gold'))return'#fc0';if(l.includes('iron'))return'#bbb';
  if(l.includes('wood'))return'#a84';if(l.includes('stone'))return'#999';
  if(l.includes('bed'))return'#f6a';if(l.includes('wool'))return'#eee';
  return'#888';
}
function shortName(id){
  if(!id)return'?';
  const p=id.split(':');const n=(p[1]||p[0]||'').replace(/_/g,' ');
  return n.length>14?n.substring(0,12)+'..':n;
}

/* ---------- players ---------- */
async function loadPlayers(){
  const body=document.getElementById('playersBody');
  try{const list=await api('/players');
    if(!list.length){body.innerHTML='<div class="empty">Сейчас никого нет в игре</div>';return;}
    body.innerHTML='<div class="players">'+list.map(p=>{
      let invHtml='';
      try{
        const items=typeof p.inventory==='string'?JSON.parse(p.inventory):(p.inventory||[]);
        if(items.length){
          const slots=new Map();
          items.forEach(i=>{slots.set(i.s,i);});
          // Armor row
          let armorRow='<div style="display:flex;gap:3px;margin-top:8px">';
          [39,38,37,36].forEach(s=>{
            const it=slots.get(s);
            if(it)armorRow+=`<div title="${esc(shortName(it.id))} x${it.c}" style="width:28px;height:28px;background:${getItemColor(it.id)}22;border:1px solid ${getItemColor(it.id)}66;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;color:${getItemColor(it.id)};cursor:help">${esc(shortName(it.id).substring(0,3))}</div>`;
            else armorRow+=`<div style="width:28px;height:28px;background:#11111822;border:1px solid #ffffff08;border-radius:4px"></div>`;
          });
          // Offhand
          const oh=slots.get(40);
          if(oh)armorRow+=`<div title="${esc(shortName(oh.id))} x${oh.c}" style="width:28px;height:28px;background:${getItemColor(oh.id)}22;border:1px solid ${getItemColor(oh.id)}66;border-radius:4px;margin-left:8px;display:flex;align-items:center;justify-content:center;font-size:9px;color:${getItemColor(oh.id)};cursor:help">${esc(shortName(oh.id).substring(0,3))}</div>`;
          armorRow+='</div>';
          invHtml+=armorRow;
          // Hotbar
          let hotbar='<div style="display:flex;gap:3px;margin-top:5px">';
          for(let i=0;i<9;i++){
            const it=slots.get(i);
            if(it)hotbar+=`<div title="${esc(shortName(it.id))} x${it.c}" style="width:28px;height:28px;background:${getItemColor(it.id)}22;border:1px solid ${getItemColor(it.id)}66;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;color:${getItemColor(it.id)};cursor:help;overflow:hidden;text-overflow:ellipsis">${esc(shortName(it.id).substring(0,4))}</div>`;
            else hotbar+=`<div style="width:28px;height:28px;background:#11111822;border:1px solid #ffffff08;border-radius:4px"></div>`;
          }
          hotbar+='</div>';
          invHtml+=hotbar;
          // Main inventory (3 rows)
          for(let row=0;row<3;row++){
            let invRow='<div style="display:flex;gap:3px;margin-top:3px">';
            for(let col=0;col<9;col++){
              const s=9+row*9+col;
              const it=slots.get(s);
              if(it)invRow+=`<div title="${esc(shortName(it.id))} x${it.c}" style="width:28px;height:28px;background:${getItemColor(it.id)}22;border:1px solid ${getItemColor(it.id)}66;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;color:${getItemColor(it.id)};cursor:help;overflow:hidden;text-overflow:ellipsis">${esc(shortName(it.id).substring(0,4))}</div>`;
              else invRow+=`<div style="width:28px;height:28px;background:#11111822;border:1px solid #ffffff08;border-radius:4px"></div>`;
            }
            invRow+='</div>';
            invHtml+=invRow;
          }
        }
      }catch(ex){}
      return `
      <div class="player">
        <div class="ph"><span class="pn">${esc(p.username||'—')}</span><span class="badge b-ok"><span class="dot"></span>онлайн</span></div>
        <div class="row"><span>Сервер</span><span class="server-tag">${esc(p.server||'—')}</span></div>
        ${p.anarchy?'<div class="row"><span>Анархия</span><b style="color:#ffb347">'+esc(p.anarchy)+'</b></div>':''}
        <div class="row"><span>IP сервера</span><b>${esc(p.ip||'—')}</b></div>
        <div class="row"><span>Измерение</span><b>${esc(p.dimension||'—')}</b></div>
        <div class="row"><span>Биом</span><span class="muted">${esc(p.biome||'—')}</span></div>
        <div class="row"><span>Гейммод</span><b>${esc(p.gamemode||'—')}</b></div>
        <div class="row"><span>Координаты</span><b>${p.pos_x||0}, ${p.pos_y||0}, ${p.pos_z||0}</b></div>
        <div class="row"><span>Здоровье</span><b>${p.health||0}/${p.max_health||0}</b></div>
        <div class="row"><span>Пинг</span><b>${p.ping>=0?p.ping+' мс':'—'}</b></div>
        <div class="row"><span>Онлайн</span><b>${p.online_count||0}</b></div>
        <div class="row"><span>Версия</span><b>${esc(p.version||'—')}</b></div>
        <div class="row"><span>Клиент</span><b>${esc(p.brand||'Jartix')}</b></div>
        <div class="row"><span>Активность</span><b>${ago(p.created_at)}</b></div>
        ${invHtml?'<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--line)"><div style="font-size:11px;color:var(--dim);margin-bottom:4px">ИНВЕНТАРЬ</div>'+invHtml+'</div>':''}
      </div>`;
    }).join('')+'</div>';
  }catch(e){body.innerHTML='<div class="empty">'+esc(e.message)+'</div>';}
}
